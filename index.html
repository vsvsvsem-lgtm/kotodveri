function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
let AC=null,PU=null;
const curW=()=>ADV.findIndex(a=>!a.f&&TD>=U(a.m,a.d)&&TD<U(a.m,a.d)+7),PL=()=>PU?"⏹ Остановить мурчание":"🐾 Слушать мурчание";
function purr(on){
 if(!on){if(PU){PU();PU=null}return}
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
  const sr=AC.sampleRate,buf=AC.createBuffer(1,sr*2,sr),d=buf.getChannelData(0);let l=0;
  for(let i=0;i<d.length;i++){l=(l+.05*(Math.random()*2-1))/1.05;d[i]=l*7}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const f1=AC.createBiquadFilter(),f2=AC.createBiquadFilter(),g2=AC.createGain(),am=AC.createGain(),out=AC.createGain();
  f1.type=f2.type="bandpass";f1.frequency.value=170;f1.Q.value=.8;f2.frequency.value=520;f2.Q.value=.9;g2.gain.value=.35;
  am.gain.value=.5;const l1=AC.createOscillator(),lg=AC.createGain();l1.frequency.value=25;lg.gain.value=.5;l1.connect(lg);lg.connect(am.gain);
  out.gain.value=0;const l2=AC.createOscillator(),lg2=AC.createGain();l2.frequency.value=.35;lg2.gain.value=.12;l2.connect(lg2);lg2.connect(out.gain);
  src.connect(f1);src.connect(f2);f2.connect(g2);f1.connect(am);g2.connect(am);am.connect(out);out.connect(AC.destination);
  src.start();l1.start();l2.start();out.gain.setTargetAtTime(.7,AC.currentTime,.4);
  PU=()=>{out.gain.cancelScheduledValues(AC.currentTime);out.gain.setTargetAtTime(0,AC.currentTime,.12);setTimeout(()=>{try{src.stop();l1.stop();l2.stop()}catch(e){}},600)};
 }catch(e){PU=null;toast("Звук недоступен на этом устройстве")}
}
function card(k){

 sh.innerHTML=`<div><div class="top"><button class="purr" aria-pressed="${!!PU}">${PL()}</button></div><div class="scene">${cat(b,P(k))}</div><h2>${b.n}</h2><p class="hi">${ad&&!fin?"На этой неделе":"Сегодня"} тебя приветствует ${b.n}!</p><h3>Кто это?</h3><p>${b.who}</p><h3>Какой характер?</h3><p>${b.ch}</p><h3>Котиковый факт</h3><p>${b.f}</p><div class="mau"${fin?' style="font-size:20px"':""}>${fin?"С новым заМУРчательным годом!":"мау!"}</div><div class="acts"><button class="main" id="sr">Поделиться карточкой</button><button id="cl">Закрыть дверцу</button></div></div>`;

 $("#sr").onclick=async()=>{const t=`${ad&&!fin?"На этой неделе":"Сегодня"} меня встретил(а) ${b.n}! Котодвери: за каждой дверцей ждёт что-то заМУРчательное.`;try{if(navigator.share){await navigator.share({text:t})}else{await navigator.clipboard.writeText(t);toast("Текст скопирован")}}catch(e){toast("Не удалось поделиться")}};

}
function openDay(k){

ения у кошки шире человеческого — около 200 градусов.", "Для ночного зрения кошке нужно гораздо меньше света, чем человеку.", "На коротких рывках домашняя кошка может разгоняться примерно до 48 километров в час.", "У взрослой кошки 30 зубов, а у котёнка 26 молочных.", "Кошка пьёт, быстро касаясь воды кончиком языка: за ним тянется столбик воды, и она его ловит.", "Нормальная температура тела кошки — около 38–39 градусов.", "Сердце кошки бьётся примерно в два раза быстрее человеческого.", "Котовник, или кошачья мята, действует примерно на две трети кошек, остальным он безразличен.", "Хвост помогает кошке держать равновесие при прыжках и на узких поверхностях.", "Потираясь головой о мебель и людей, кошка оставляет запах со щёк: так она помечает своё как «своё».", "Кошки умеют издавать много разных звуков: мяуканье, мурлыканье, чириканье, трели.", "Черепаховые и калико-кошки почти всегда кошки, а не коты: окрас связан с Х-хромосомой.", "Среди рыжих котов мальчиков примерно в четыре раза больше, чем девочек.", "Первой кошкой в космосе стала француженка Фелисетт в 1963 году. Она благополучно вернулась на Землю.", "Группу кошек называют по-английски «клауддер».", "В Древнем Египте кошек почитали, а богиню Бастет изображали с кошачьей головой.", "Мурлыканье кошки звучит непрерывно: и на вдохе, и на выдохе.", "Домашние кошки живут в среднем 12–18 лет, а рекордсменка прожила 38 лет.", "Кошки плохо видят предметы вплотную к носу, поэтому им помогают усы.", "Белые кошки с голубыми глазами рождаются глухими чаще других."];
