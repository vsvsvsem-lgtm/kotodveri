ng.","ch":"Reserved, loyal and quiet. May watch new people for a while at first.","f":"Its coat is double, which makes it especially pleasant to stroke.","o":"The breed is said to be linked to Arkhangelsk; the modern breed was developed in Britain and Scandinavia from the late 19th century. Known for a silvery-blue coat and a reserved, loyal character.","sz":"Females about 3–4 kg, males about 4–5.5 kg","ls":"Often cited as 15–20 years","tr":["Reserved","Loyal","Quiet","Clever"],"ac":"Moderate","cr":"Dense double coat: brushing about once a week, more often when shedding. Baths are rarely needed.","cp":"May be shy with strangers. Usually calm around children and animals in a quiet home, and values a familiar routine.","hl":"Generally regarded as a healthy breed; prone to gaining extra weight."},{"n":"British Shorthair","who":"A plush dense coat, a round head, chubby cheeks and big round eyes.","ch":"Calm and independent, yet affectionate. Likes to watch the house from a comfy spot.","f":"British Shorthairs are often linked to the Cheshire Cat from Alice in Wonderland.","o":"One of the oldest breeds of Britain: its ancestors were shown at the first cat shows of the 19th century. Known for a plush coat and a calm, independent temperament.","sz":"Females about 3.5–5.5 kg, males about 5–8 kg","ls":"About 12–17 years","tr":["Calm","Independent","Affectionate","Unflappable"],"ac":"Low to moderate","cr":"Thick plush coat: brushing about once a week, more often during seasonal shedding. Baths are rarely needed.","cp":"Usually tolerant of children and other animals. Many dislike being carried for long.","hl":"Known tendencies include excess weight and cardiomyopathy."},{"n":"Sphynx","who":"Almost hairless: the skin is covered with fine down. Big ears, expressive eyes and wrinkles on the face.","ch":"Affectionate and very attached. Loves warmth and staying close to its person.","f":"Sphynxes feel warm to the touch, like a hot-water bottle.","o":"The breed appeared in Canada in ts' eyes glow in the dark thanks to a special layer that reflects light back to the retina.","Cats can't taste sweetness: they have no working sweet taste receptor.","A slow blink toward a person is often called a \"cat kiss\". You can blink back.","Adult cats meow mostly at people; with each other they communicate through body language, tails and scents.","A tail held high is a sign of friendliness and greeting.","Cats almost always land on their feet thanks to a flexible spine and a righting reflex in mid-air.","A cat's tongue is covered with tiny barbs that work like a comb.","Cats \"knead\" with their paws, as they did as kittens with their mother, when they feel good and relaxed.","A cat can jump about five times its own height.","Domestic cats descend from the wild cat of the Near East and have lived alongside people for about ten thousand years.","Kittens are born blind and deaf: their eyes open at about 7–10 days.","Cats sweat mainly through the pads of their paws.","Cats hear very high-pitched sounds that humans can't, which is why they notice mice.","Cats spend a lot of time grooming: licking is calming and helps regulate body temperature.","Cats \"taste the air\": the open mouth and frozen expression (the flehmen response) help guide scents to a special organ in the palate.","Cats distinguish fewer colours than people: they see blue and green-yellow shades best.","A cat's field of view is wider than ours, about 200 degrees.","A cat needs far less light than a human to see at night.","In short bursts a house cat can reach about 48 kilometres per hour.","An adult cat has 30 teeth, and a kitten has 26 baby teeth.","A cat drinks by quickly touching the water with the tip of its tongue: a column of water follows it, and the cat catches it.","A cat's normal body temperature is around 38–39 degrees Celsius.","A cat's heart beats about twice as fast as a human's.","Catnip affects about two thirds of cats; the rest are indifferent to it.","The tail helps a cat keep its balance when jumping and on narrow surfaces.","By rubbing their heads on furniture and people, cats leave a scent from their cheeks: that's how they mark something as \"theirs\".","Cats can make many different sounds: meows, purrs, chirps, trills.","Tortoiseshell and calico cats are almost always female: the coat colour is linked to the X chromosome.","Among ginger cats, there are about four times as many males as females.","The first cat in space was the French cat Félicette in 1963. She returned safely to Earth.","A group of cats is called a \"clowder\".","In ancient Egypt cats were revered, and the goddess Bastet was depicted with a cat's head.","A cat's purr is continuous: it sounds on both the inhale and the exhale.","Domestic cats live 12–18 years on average, and the record holder lived to 38.","Cats see objects right in front of their nose poorly, so their whiskers help.","White cats with blue eyes are born deaf more often than others."]};
